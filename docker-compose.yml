services:
  retro-radio:
    build: .
    image: retro-radio:local
    ports:
      - "80:8080"
    environment:
      RETRO_DB: /data/retro-radio.db
      RETRO_PUBLIC_URL: ${RETRO_PUBLIC_URL:-http://pure.wifiradiofrontier.com}
      RETRO_ADMIN_USER: ${RETRO_ADMIN_USER:-admin}
      RETRO_ADMIN_PASSWORD: ${RETRO_ADMIN_PASSWORD:-}
      RETRO_CATALOGUE_URL: ${RETRO_CATALOGUE_URL:-}
      RETRO_MUSIC_SERVER_URL: ${RETRO_MUSIC_SERVER_URL:-}
      RETRO_RADIO_HTTPS: ${RETRO_RADIO_HTTPS:-false}
      RETRO_MUSIC_TRANSCODE: ${RETRO_MUSIC_TRANSCODE:-true}
    volumes:
      - retro-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  retro-data:
