services:
  retro-radio:
    build: .
    image: retro-radio:local
    ports:
      - "80:8080"
    environment:
      RETRO_DB: /data/retro-radio.db
      RETRO_PUBLIC_URL: ${RETRO_PUBLIC_URL:-http://pure.wifiradiofrontier.com}
      RETRO_ADMIN_USER: ${RETRO_ADMIN_USER:-admin}
      RETRO_ADMIN_PASSWORD: ${RETRO_ADMIN_PASSWORD:-}
      RETRO_CATALOGUE_URL: ${RETRO_CATALOGUE_URL:-}
      RETRO_MUSIC_SERVER_URL: ${RETRO_MUSIC_SERVER_URL:-}
      RETRO_RADIO_HTTPS: ${RETRO_RADIO_HTTPS:-false}
      RETRO_MUSIC_TRANSCODE: ${RETRO_MUSIC_TRANSCODE:-true}
      RETRO_AGENT_FM: ${RETRO_AGENT_FM:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RETRO_AGENT_TEXT_MODEL: ${RETRO_AGENT_TEXT_MODEL:-gpt-6.1-sol}
      RETRO_AGENT_LOCAL_MODEL: ${RETRO_AGENT_LOCAL_MODEL:-gpt-4.1-mini}
      RETRO_AGENT_SPEECH_MODEL: ${RETRO_AGENT_SPEECH_MODEL:-gpt-4o-mini-tts}
      RETRO_AGENT_VOICE: ${RETRO_AGENT_VOICE:-ballad}
      RETRO_AGENT_DELIVERY: ${RETRO_AGENT_DELIVERY:-}
      RETRO_UPNP_DISCOVERY_FILE: /run/retro-upnp/discovery.json
    volumes:
      - retro-data:/data
      - upnp-discovery:/run/retro-upnp:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  upnp-discovery:
    build: .
    image: retro-radio:local
    command: ["-upnp-discovery-helper"]
    network_mode: host
    read_only: true
    volumes:
      - upnp-discovery:/run/retro-upnp
    restart: unless-stopped
    healthcheck:
      disable: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  retro-data:
  upnp-discovery:
