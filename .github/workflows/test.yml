name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.x'
          cache: true
      - name: Install FFmpeg for adaptive audio tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: go test -race ./...
      - run: go vet ./...
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/retro-amd64 ./cmd/retro-radio
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/retro-arm64 ./cmd/retro-radio
